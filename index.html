<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>防災 WebAR</title>
  </head>
  <body>
    <video id="camera-feed" playsinline muted autoplay></video>
    <canvas id="slam-feed"></canvas>
    <canvas id="scene"></canvas>

    <div id="overlay">
      <div id="underwater"></div>

      <section id="menu" class="screen">
        <header class="menu-header">
          <p class="eyebrow">PREPAREDNESS WebAR</p>
          <h1>防災AR体験</h1>
          <p class="lead">身近な災害を、目の前の空間で体験しよう。</p>
          <p id="mode-badge" class="badge">対応状況を確認中…</p>
        </header>
        <div class="cards">
          <button class="card" data-scenario="block">
            <span class="card-icon">🧱</span>
            <span class="card-body">
              <strong>ブロック塀の倒壊</strong>
              <small>地震でブロック塀が倒れてくる様子を体験</small>
            </span>
          </button>
          <button class="card" data-scenario="flood">
            <span class="card-icon">🌊</span>
            <span class="card-body">
              <strong>洪水・浸水</strong>
              <small>足首〜頭上まで、浸水の深さを実寸で体感</small>
            </span>
          </button>
          <button class="card" data-scenario="road">
            <span class="card-icon">🛣️</span>
            <span class="card-body">
              <strong>路面の陥没・崩壊</strong>
              <small>道路にひびが入り、崩れていく様子を観察</small>
            </span>
          </button>
          <button class="card" data-scenario="pole">
            <span class="card-icon">⚡</span>
            <span class="card-body">
              <strong>電柱の倒壊</strong>
              <small>電柱が連鎖的に倒れる危険範囲を確認</small>
            </span>
          </button>
          <button class="card" id="btn-warehouse">
            <span class="card-icon">🏚️</span>
            <span class="card-body">
              <strong>防災倉庫をスキャン</strong>
              <small>「防」マークをカメラで読み取り、収納品を確認</small>
            </span>
          </button>
        </div>
        <div class="hazard">
          <button id="btn-hazard" class="ghost">📍 この場所の浸水想定を調べる</button>
          <p id="hazard-result" hidden></p>
        </div>
        <p class="footnote">周囲の安全を確認し、広い場所で体験してください。</p>
        <p class="credit">
          6DoF tracking: 8th Wall Engine © Niantic Spatial, Inc. —
          <a href="https://github.com/8thwall/engine/blob/main/LICENSE" target="_blank" rel="noopener">license &amp; disclaimer of warranties</a>
          <br />
          画像トラッキング: <a href="https://github.com/hiukim/mind-ar-js" target="_blank" rel="noopener">MindAR.js</a>
        </p>
      </section>

      <section id="hud" hidden>
        <header class="hud-top">
          <button id="btn-back" class="ghost">← メニュー</button>
          <h2 id="hud-title"></h2>
        </header>
        <div id="hud-status"></div>
        <div class="hud-bottom">
          <p id="hud-hint"></p>
          <label id="hud-slider" hidden>
            <span class="slider-label"></span>
            <input type="range" />
            <output></output>
          </label>
          <div id="hud-actions"></div>
          <div id="hud-adjust" hidden>
            <span>位置調整</span>
            <button data-nudge="rot-l" aria-label="左に回転">↺</button>
            <button data-nudge="rot-r" aria-label="右に回転">↻</button>
            <button data-nudge="near">近く</button>
            <button data-nudge="far">遠く</button>
          </div>
        </div>
      </section>

      <section id="warehouse-hud" hidden>
        <header class="hud-top">
          <button id="btn-warehouse-back" class="ghost">← メニュー</button>
          <h2>防災倉庫</h2>
        </header>
        <p id="warehouse-hint" class="warehouse-hint">防災倉庫の「防」マークにカメラを向けてください</p>
        <aside id="warehouse-panel" class="warehouse-panel" hidden>
          <header class="warehouse-panel-head">
            <div>
              <strong id="warehouse-panel-title">防災倉庫</strong>
              <small id="warehouse-panel-place"></small>
            </div>
            <button id="btn-warehouse-close" class="ghost" aria-label="閉じる">×</button>
          </header>
          <div id="warehouse-panel-body" class="warehouse-panel-body"></div>
        </aside>
      </section>

      <div id="loading" hidden><div class="spinner"></div><p>読み込み中…</p></div>
      <div id="toast"></div>
    </div>

    <div id="warehouse-scan" hidden></div>
    <audio id="warehouse-audio" src="./audio/warehouse.mp3" preload="none" playsinline></audio>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
